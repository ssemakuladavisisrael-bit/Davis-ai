name: Davis AI verification checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/meridian-verified-reasoning]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run lint
      - name: Check Python harness syntax
        run: python -m py_compile davis_harness.py
      - name: Validate Meridian dataset
        run: python -m json.tool meridian_variants.json > /dev/null
